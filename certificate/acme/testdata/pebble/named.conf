# The name server of the Pebble test: a zone that only resolves (http.lab)
# and one that takes dynamic updates signed with the test key (dns.lab).
key "norca-acme" { algorithm hmac-sha256; secret "c2VjcmV0LXNlY3JldC1zZWNyZXQtc2VjcmV0LXNlY3JldA=="; };
options {
  directory "/var/lib/bind";
  listen-on { any; };
  listen-on-v6 { none; };
  recursion no;
  allow-query { any; };
  dnssec-validation no;
};
zone "http.lab" { type primary; file "/var/lib/bind/db.http.lab"; };
zone "dns.lab" { type primary; file "/var/lib/bind/db.dns.lab"; allow-update { key "norca-acme"; }; };
